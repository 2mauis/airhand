# 服务端工作区（协议库 + 中转服务器）。
# 客户端（Tauri）位于 client/src-tauri，是一个独立的 Cargo 工作区，
# 这样 Docker 构建服务端时无需拉取任何 GUI 依赖。
[workspace]
resolver = "3"
members = ["crates/airhand-proto", "server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
