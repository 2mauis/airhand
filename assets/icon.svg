<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Airhand 图标：渐变圆角方块 + 远程光标 + "空中"信号波 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B5CFF"/>
      <stop offset="0.52" stop-color="#4C7DFF"/>
      <stop offset="1" stop-color="#12D3EE"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.12" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cursor" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4EEFF"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#160F5C" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#glow)"/>
  <rect x="34" y="34" width="956" height="956" rx="222" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="4"/>

  <!-- 信号波：以光标尖端为圆心 -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" filter="url(#shadow)">
    <path d="M 330 409 A 154 154 0 0 1 484 255" stroke-width="54" stroke-opacity="0.95"/>
    <path d="M 226 409 A 258 258 0 0 1 484 151" stroke-width="54" stroke-opacity="0.6"/>
  </g>

  <!-- 光标 -->
  <path filter="url(#shadow)" fill="url(#cursor)" stroke="url(#cursor)" stroke-width="44" stroke-linejoin="round"
        d="M 484 409 L 484 783 L 583 700 L 645 846 L 708 820 L 645 674 L 770 674 Z"/>
</svg>
