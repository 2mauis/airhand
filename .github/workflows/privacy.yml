# 移植自 2mauis 的 passkey-demo 项目 workflow v2（MIT，Copyright (c) 2026 2mauis），按本 fork 调整：
# 阻断项只扫“本次新增的行”（PR 对 base；push main 对 before）；上游既有内容里的正则误报见 docs/workflow-v2.md，全库扫描降为信息性步骤。
name: privacy
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  privacy-scan:
    name: privacy-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22" }
      - name: 扫描 PR 新增的行
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/privacy-scan.mjs --diff "origin/${BASE_REF}"
      - name: 扫描 push 新增的行
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ && "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ]]
          node scripts/privacy-scan.mjs --diff "$BEFORE_SHA"
      - name: 扫描 PR 正文与标题
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | node scripts/privacy-scan.mjs --stdin
      - name: 全库扫描（信息性，不阻断：上游既有内容有已知的正则误报）
        continue-on-error: true
        run: node scripts/privacy-scan.mjs
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: 安装 gitleaks（固定版本 + 校验和）
        run: |
          V=8.30.1
          curl -sSfL -o /tmp/gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v$V/gitleaks_${V}_linux_x64.tar.gz"
          curl -sSfL -o /tmp/gl.txt "https://github.com/gitleaks/gitleaks/releases/download/v$V/gitleaks_${V}_checksums.txt"
          (cd /tmp && grep " gl.tgz$\| gitleaks_${V}_linux_x64.tar.gz$" gl.txt | sed "s/gitleaks_${V}_linux_x64.tar.gz/gl.tgz/" | sha256sum -c -)
          tar -xzf /tmp/gl.tgz -C /tmp gitleaks
      - name: 扫描完整历史
        run: /tmp/gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1 .
