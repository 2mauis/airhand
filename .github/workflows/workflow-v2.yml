# agent-trailer 按署名规范 v3 检查（docs/specs/commit-signature-v3.md）。
name: workflow-v2
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
jobs:
  agent-trailer:
    name: agent-trailer
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22" }
      - name: 署名与 trailer（按 base 版放行表，docs/specs/commit-signature-v3.md §2.1）
        run: |
          set -euo pipefail
          git cat-file -e "origin/${BASE_REF}^{commit}"
          if git cat-file -e "origin/${BASE_REF}:scripts/allowed-author-hashes.json" 2>/dev/null; then
            git show "origin/${BASE_REF}:scripts/allowed-author-hashes.json" > "$RUNNER_TEMP/base-allowed-author-hashes.json"
          else
            printf '%s\n' '{"version":1,"sha256_lowercase_email":[]}' > "$RUNNER_TEMP/base-allowed-author-hashes.json"
          fi
          node scripts/agent-trailer.mjs --range "origin/${BASE_REF}..${HEAD_SHA}" --require-nonempty --allow-hashes-file "$RUNNER_TEMP/base-allowed-author-hashes.json"
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  spec-requires-tests:
    name: spec-requires-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false, ref: "${{ github.event.pull_request.head.sha }}" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22" }
      - run: node scripts/check-spec-tests.mjs "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
  workflow-scripts:
    name: workflow-scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22" }
      - run: node tests/workflow-scripts.mjs
