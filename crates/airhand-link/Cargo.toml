[package]
name = "airhand-link"
description = "Airhand client side of the relay link: QUIC with certificate pinning and reconnects, session streams, UI-independent controller sessions and the host's server connection"
version = "0.2.2"
edition = "2024"
license = "MIT"

# 桌面客户端（client/src-tauri）、网页控制台（web/）和 Android（android/native）共用，不依赖任何 GUI 库。
# 两者都是独立的 Cargo 工作区；这个库和 airhand-proto 一样属于根目录的工作区（在仓库根目录 cargo test）
# 先红验收测试的空操作开关（docs/specs/tailcat-p2p.md「先红验收测试清单」#98）：只改变 tests/ 里驱动的行为，
# 不影响库本身；两个互斥（src/lib.rs 里的 compile_error!），Lenient / Strict 两个 CI 作业分开构建。
[features]
noop-lenient = []
noop-strict = []

[dependencies]
airhand-proto = { path = "../airhand-proto" }
anyhow = "1"
bytes = "1"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rand = "0.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net"] }
tracing = "0.1"

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["test-util"] }
