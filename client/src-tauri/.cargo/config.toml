# 静态链接 C 运行时：发布的 airhand.exe 是一个独立文件，不依赖 VC++ 运行库
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# 用 CMake 构建的 C 依赖（libopus）同样使用静态运行时（/MT），见 cmake/msvc-static-crt.cmake
[env]
CMAKE_TOOLCHAIN_FILE_x86_64_pc_windows_msvc = { value = "cmake/msvc-static-crt.cmake", relative = true }
CMAKE_TOOLCHAIN_FILE_aarch64_pc_windows_msvc = { value = "cmake/msvc-static-crt.cmake", relative = true }

# macOS：最低支持 13（ScreenCaptureKit 采集系统声音需要 13），与 tauri.macos.conf.json 的 minimumSystemVersion 一致。
# 只影响 Apple 目标；已经设置了这个环境变量（例如 tauri build）时以环境变量为准
MACOSX_DEPLOYMENT_TARGET = "13.0"
