[package]
name = "p2p-bench"
description = "Phase 0 spike bench: airhand QUIC over the tailcat helper (spike only, do not reuse)"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

# Standalone: not part of the root workspace.
[workspace]

[dependencies]
airhand-link = { path = "../../../crates/airhand-link" }
airhand-proto = { path = "../../../crates/airhand-proto" }
anyhow = "1"
bytes = "1"
libc = "0.2"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rand = "0.9"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = 3
debug = false
